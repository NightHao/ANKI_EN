<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="620" viewBox="0 0 1050 620" role="img" aria-label="MOVEMENT — START, PATH, ENDPOINT"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#0f766e"/></marker></defs><rect width="1050" height="620" fill="#f8fafc"/><text x="25" y="38" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">MOVEMENT — START, PATH, ENDPOINT</text><text x="25" y="59" font-family="Arial,sans-serif" font-size="13" fill="#475569">Common patterns — meanings can overlap depending on context</text><rect x="20" y="82" width="245" height="245" rx="5" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="35" y="109" font-family="Arial,sans-serif" font-size="18" fill="#0f172a" font-weight="bold">TO / TOWARD</text><circle cx="222" cy="206" r="15" fill="#94a3b8"/><path d="M66 206 L198 206" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/><text x="33" y="314" font-family="Arial,sans-serif" font-size="13" fill="#475569" font-weight="normal">destination / direction</text><rect x="275" y="82" width="245" height="245" rx="5" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="290" y="109" font-family="Arial,sans-serif" font-size="18" fill="#0f172a" font-weight="bold">FROM / AWAY FROM</text><circle cx="332" cy="206" r="13" fill="#94a3b8"/><path d="M353 206 L478 206" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/><text x="288" y="314" font-family="Arial,sans-serif" font-size="13" fill="#475569" font-weight="normal">start / move farther away</text><rect x="530" y="82" width="245" height="245" rx="5" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="545" y="109" font-family="Arial,sans-serif" font-size="18" fill="#0f172a" font-weight="bold">INTO / OUT OF</text><rect x="605" y="167" width="102" height="95" rx="5" fill="#edf4f7" stroke="#94a3b8" stroke-width="2"/><path d="M564 205 L639 205" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/><path d="M674 239 L746 239" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" /><text x="543" y="314" font-family="Arial,sans-serif" font-size="13" fill="#475569" font-weight="normal">cross an enclosure boundary</text><rect x="785" y="82" width="245" height="245" rx="5" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="800" y="109" font-family="Arial,sans-serif" font-size="18" fill="#0f172a" font-weight="bold">ONTO / OFF</text><rect x="855" y="234" width="98" height="15" rx="5" fill="#edf4f7" stroke="#94a3b8" stroke-width="2"/><path d="M819 187 L876 227" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/><path d="M917 225 L990 183" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" /><text x="798" y="314" font-family="Arial,sans-serif" font-size="13" fill="#475569" font-weight="normal">cross a surface boundary</text><rect x="20" y="350" width="245" height="245" rx="5" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="35" y="377" font-family="Arial,sans-serif" font-size="18" fill="#0f172a" font-weight="bold">ACROSS / THROUGH</text><rect x="79" y="441" width="127" height="80" rx="5" fill="#edf4f7" stroke="#94a3b8" stroke-width="2"/><path d="M54 481 L227 481" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/><text x="33" y="582" font-family="Arial,sans-serif" font-size="13" fill="#475569" font-weight="normal">cross an area or interior</text><rect x="275" y="350" width="245" height="245" rx="5" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="290" y="377" font-family="Arial,sans-serif" font-size="18" fill="#0f172a" font-weight="bold">ALONG / PAST</text><path d="M329 456 L475 456" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/><path d="M329 520 L475 520" fill="no