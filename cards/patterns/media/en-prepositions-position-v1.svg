<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="620" viewBox="0 0 1050 620" role="img" aria-label="POSITION — RELATIVE TO A REFERENCE"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#0f766e"/></marker></defs><rect width="1050" height="620" fill="#f8fafc"/><text x="25" y="38" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">POSITION — RELATIVE TO A REFERENCE</text><text x="25" y="59" font-family="Arial,sans-serif" font-size="13" fill="#475569">Common patterns — meanings can overlap depending on context</text><rect x="20" y="82" width="245" height="245" rx="5" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="35" y="109" font-family="Arial,sans-serif" font-size="18" fill="#0f172a" font-weight="bold">ABOVE / OVER</text><rect x="80" y="217" width="126" height="34" rx="5" fill="#edf4f7" stroke="#94a3b8" stroke-width="2"/><circle cx="141" cy="174" r="10" fill="#0f766e"/><text x="83" y="286" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">above = higher</text><text x="33" y="314" font-family="Arial,sans-serif" font-size="13" fill="#475569" font-weight="normal">higher; over may cover</text><rect x="275" y="82" width="245" height="245" rx="5" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="290" y="109" font-family="Arial,sans-serif" font-size="18" fill="#0f172a" font-weight="bold">ON / UNDER</text><rect x="340" y="215" width="110" height="35" rx="5" fill="#edf4f7" stroke="#94a3b8" stroke-width="2"/><circle cx="395" cy="203" r="10" fill="#0f766e"/><circle cx="395" cy="270" r="10" fill="#d97706"/><text x="288" y="314" font-family="Arial,sans-serif" font-size="13" fill="#475569" font-weight="normal">surface / below it</text><rect x="530" y="82" width="245" height="245" rx="5" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="545" y="109" font-family="Arial,sans-serif" font-size="18" fill="#0f172a" font-wei