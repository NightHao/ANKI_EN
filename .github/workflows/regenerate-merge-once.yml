name: Regenerate approved ZIP imports once

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.repository == 'NightHao/ANKI_EN'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate with the repository builders
        run: |
          python3 cards/vocabulary/scripts/update_vocabulary.py rebuild
          python3 cards/tools/build_import.py
          python3 cards/tools/build_connection_import.py --final
          python3 scripts/build_semantic_index.py
          python3 scripts/check_cards.py
      - name: Verify real Anki collection migration tests
        run: |
          pip install anki==26.9.3
          python3 scripts/anki/test_anki_sync.py
          python3 scripts/anki/test_deck_migration.py
      - name: Commit only generated outputs
        run: |
          git add -- cards/vocabulary/exports/anki_import.csv \
            cards/patterns/anki-import.tsv cards/connections/anki-import.tsv \
            cards/semantic/index.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Rebuild exports after merging approved Patterns layout and Vocabulary updates"
            git push origin HEAD:main
          fi
