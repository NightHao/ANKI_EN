name: Export offline EN repository snapshot

on:
  push:
    paths:
      - .github/workflows/export-offline-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package complete repository snapshot
        run: |
          mkdir -p dist
          zip -qr dist/ANKI_EN_full_source.zip . -x './.git/*' './dist/*'
          unzip -t dist/ANKI_EN_full_source.zip | tail -1
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ANKI_EN_complete_source
          path: dist/ANKI_EN_full_source.zip
          retention-days: 7
